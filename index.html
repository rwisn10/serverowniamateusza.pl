<!DOCTYPE html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Przerwa techniczna — Mateusz Talar</title><link rel="icon" href="logo.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,600;0,6..72,800;1,6..72,600&family=IBM+Plex+Sans+Condensed:wght@600&family=IBM+Plex+Sans:wght@400&display=swap');
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{display:grid;place-items:center;text-align:center;color:#fff;font-family:'IBM Plex Sans',Arial,sans-serif;background:radial-gradient(900px 500px at 80% -10%,rgba(122,18,38,.55),transparent 60%),radial-gradient(700px 500px at 0% 110%,rgba(44,55,66,.9),transparent 60%),#14181d;padding:24px;overflow:hidden}
body::before{content:"";position:fixed;inset:0;background:repeating-linear-gradient(135deg,transparent 0 26px,rgba(255,255,255,.02) 26px 27px);pointer-events:none}
main{position:relative;max-width:640px;animation:in .9s ease both}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.crest{width:104px;display:block;margin:0 auto 26px;filter:drop-shadow(0 0 28px rgba(200,16,46,.45));animation:pulse 3.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.k{font-family:'IBM Plex Sans Condensed',Arial,sans-serif;font-weight:600;letter-spacing:.3em;text-transform:uppercase;font-size:.8rem;color:#d6a1ab;margin-bottom:14px}
h1{font-family:'Newsreader',Georgia,serif;font-weight:800;font-size:clamp(2.6rem,8vw,4.6rem);line-height:1.05;letter-spacing:-.02em}
h1 em{display:block;font-style:italic;font-weight:600;color:#e0b0b9;font-size:.7em;margin-top:10px}
p{margin-top:22px;color:#c9c2b2;line-height:1.7;font-size:1.08rem}
.bar{width:220px;height:3px;background:rgba(255,255,255,.15);margin:34px auto 0;overflow:hidden}.bar i{display:block;width:40%;height:100%;background:#c8102e;animation:slide 1.8s ease-in-out infinite}
@keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
a.b{display:inline-block;margin-top:30px;font-family:'IBM Plex Sans Condensed',Arial,sans-serif;font-weight:600;letter-spacing:.16em;text-transform:uppercase;font-size:.85rem;color:#fff;border:1.5px solid rgba(255,255,255,.55);padding:13px 26px;text-decoration:none;transition:.2s}a.b:hover{background:#fff;color:#14181d}
small{display:block;margin-top:26px;color:#8b93a0;font-size:.85rem}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>
<main>
<img class="crest" src="logo.png" alt="Herb">
<div class="k">Mateusz Talar · Komitet Wyborczy</div>
<h1>Trwa przerwa techniczna<em>Zaraz wracamy</em></h1>
<p>Wprowadzamy ulepszenia na stronie. To potrwa tylko chwilę. Zajrzyj do nas za kilka minut.</p>
<div class="bar"><i></i></div>
<a class="b" href="index.html">Spróbuj ponownie</a>
<small>Pilna sprawa? Napisz: <a href="mailto:sztab@example.com" style="color:#e0b0b9">sztab@example.com</a></small>
</main>
<script>
/* sprawdza co 30 s, czy przerwa się skończyła; wtedy sam przenosi na stronę główną */
setInterval(()=>fetch('script.js?'+Date.now(),{cache:'no-store'}).then(r=>r.text()).then(t=>{if(/MAINTENANCE\s*=\s*false/.test(t))location.href='index.html'}).catch(()=>{}),30000);
</script>
</body></html>
