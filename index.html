<!DOCTYPE html><html lang="pl" data-przerwa="1"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Przerwa techniczna — Mateusz Talar</title><link rel="icon" href="logo.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Lexend:wght@500;700;800&family=Inter:wght@400;600&display=swap');
:root{--navy:#0d1830;--red:#e11d48;--hl:#ff9aa8;--gold:#ffc857}
*{box-sizing:border-box;margin:0}html,body{height:100%}
body{font-family:'Inter',Arial,sans-serif;color:#fff;background:var(--navy);overflow:hidden;display:grid;place-items:center;text-align:center;padding:20px}
.bg{position:fixed;inset:-20%;z-index:0;background:radial-gradient(45vw 45vh at 20% 25%,rgba(225,29,72,.55),transparent 62%),radial-gradient(50vw 50vh at 85% 80%,rgba(59,91,255,.45),transparent 62%),radial-gradient(35vw 35vh at 60% 15%,rgba(255,200,87,.25),transparent 62%);animation:aur 16s ease-in-out infinite alternate}
@keyframes aur{to{transform:translate(5%,-4%) rotate(8deg) scale(1.1)}}
.dots i{position:fixed;bottom:-20px;width:var(--s);height:var(--s);border-radius:50%;background:rgba(255,255,255,.55);left:var(--x);animation:up var(--d) linear infinite var(--dl);z-index:1}
@keyframes up{to{transform:translateY(-110vh) translateX(var(--dx));opacity:0}}
main{position:relative;z-index:2;max-width:680px;width:100%;animation:in 1s ease both}
@keyframes in{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.stage{position:relative;width:min(300px,70vw);aspect-ratio:1;margin:0 auto 30px}
.core{position:absolute;inset:22%;border-radius:50%;background:radial-gradient(circle,#fff,#e9edf7);display:grid;place-items:center;box-shadow:0 0 0 10px rgba(255,255,255,.12),0 0 80px rgba(225,29,72,.7);animation:pulse 3s ease-in-out infinite}
.core img{width:56%;animation:flo 4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 18px rgba(255,255,255,.07),0 0 110px rgba(225,29,72,.9)}}@keyframes flo{50%{transform:translateY(-6px)}}
.ring{position:absolute;inset:6%;border-radius:50%;border:2px dashed rgba(255,255,255,.4);animation:spin 26s linear infinite}.ring.r2{inset:-4%;border-color:rgba(255,154,168,.45);animation-duration:40s;animation-direction:reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.gear{position:absolute;color:var(--hl);animation:spin 8s linear infinite}.gear svg{display:block;width:100%;height:100%;overflow:visible}
.g1{width:78px;height:78px;left:-6%;top:6%}.g2{width:54px;height:54px;left:6%;top:-2%;animation-direction:reverse;animation-duration:5.6s;color:var(--gold)}.g3{width:64px;height:64px;right:-4%;bottom:6%;animation-duration:7s;color:#9ec1ff}
.orbit{position:absolute;inset:0;animation:spin 12s linear infinite}.orbit span{position:absolute;left:50%;top:-4%;font-size:1.7rem;animation:spin 12s linear infinite reverse;margin-left:-.5em}
.orbit.o2{animation-duration:17s;animation-direction:reverse}.orbit.o2 span{animation-duration:17s;animation-direction:reverse;top:auto;bottom:-6%;font-size:1.3rem}
.k{font-weight:600;letter-spacing:.28em;text-transform:uppercase;font-size:.78rem;color:var(--hl);margin-bottom:12px}
h1{font-family:'Lexend','Arial Black',sans-serif;font-weight:800;font-size:clamp(2.2rem,7vw,4rem);line-height:1.08;letter-spacing:-.02em;background:linear-gradient(100deg,#fff 20%,var(--hl) 45%,#fff 70%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 4s linear infinite}
@keyframes shine{to{background-position:-220% 0}}
.type{min-height:2em;margin-top:18px;font-size:1.25rem;color:#dbe3f5}.type::after{content:"";display:inline-block;width:3px;height:1.1em;margin-left:4px;vertical-align:-.15em;background:var(--hl);animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}
.bar{width:min(320px,80%);height:8px;border-radius:9px;background:rgba(255,255,255,.18);margin:30px auto 0;overflow:hidden}.bar i{display:block;width:38%;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--red),var(--gold));animation:slide 1.7s ease-in-out infinite}@keyframes slide{from{transform:translateX(-110%)}to{transform:translateX(280%)}}
.row{margin-top:30px;display:flex;gap:14px;justify-content:center;align-items:center;flex-wrap:wrap}
.btn{font:600 .95rem 'Inter',Arial,sans-serif;padding:14px 26px;border-radius:12px;border:2px solid #fff;background:#fff;color:var(--navy);cursor:pointer;transition:.2s}.btn:hover{background:var(--hl);border-color:var(--hl);transform:translateY(-2px)}
.chk{font-size:.9rem;color:#b9c4e0}
small{display:block;margin-top:26px;color:#9fadcf;font-size:.85rem}small a{color:var(--hl)}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>
<div class="bg"></div><div class="dots" id="dots"></div>
<main>
 <div class="stage">
  <div class="ring r2"></div><div class="ring"></div>
  <div class="orbit"><span>🐝</span></div><div class="orbit o2"><span>🐝</span></div>
  <div class="gear g1"><svg viewBox="-50 -50 100 100"><circle r="38" fill="none" stroke="currentColor" stroke-width="12" stroke-dasharray="10.4 10.4"/><circle r="31" fill="currentColor"/><circle r="12" fill="#0d1830"/></svg></div>
  <div class="gear g2"><svg viewBox="-50 -50 100 100"><circle r="38" fill="none" stroke="currentColor" stroke-width="12" stroke-dasharray="10.4 10.4"/><circle r="31" fill="currentColor"/><circle r="12" fill="#0d1830"/></svg></div>
  <div class="gear g3"><svg viewBox="-50 -50 100 100"><circle r="38" fill="none" stroke="currentColor" stroke-width="12" stroke-dasharray="10.4 10.4"/><circle r="31" fill="currentColor"/><circle r="12" fill="#0d1830"/></svg></div>
  <div class="core"><img src="logo.png" alt="Herb"></div>
 </div>
 <div class="k">Mateusz Talar · Komitet Wyborczy</div>
 <h1>Trwa przerwa techniczna</h1>
 <div class="type" id="type"></div>
 <div class="bar"><i></i></div>
 <div class="row"><button class="btn" onclick="location.reload()">Odśwież teraz</button><span class="chk" id="chk">Sprawdzam automatycznie</span></div>
 <small>Pilna sprawa? Napisz: <a href="mailto:sztab@example.com">sztab@example.com</a></small>
</main>
<script>
/* cząsteczki */
(function(){var d=document.getElementById('dots');for(var i=0;i<22;i++){var e=document.createElement('i');e.style.cssText='--s:'+(3+Math.random()*6)+'px;--x:'+Math.random()*100+'%;--d:'+(9+Math.random()*12)+'s;--dl:'+(-Math.random()*20)+'s;--dx:'+((Math.random()-.5)*120)+'px';d.appendChild(e)}})();
/* maszyna do pisania */
var MSG=['Wprowadzamy ulepszenia na stronie…','Polerujemy piksele i karmimy pszczoły…','Doba trwa 24 godziny, my wracamy szybciej.','Jeszcze chwila. Zaraz wracamy!'],mi=0,ci=0,del=false,el=document.getElementById('type');
(function tick(){var m=MSG[mi];el.textContent=m.slice(0,ci);if(!del&&ci<m.length){ci++;return setTimeout(tick,55)}if(!del){del=true;return setTimeout(tick,1600)}if(ci>0){ci--;return setTimeout(tick,22)}del=false;mi=(mi+1)%MSG.length;setTimeout(tick,300)})();
/* automatyczne sprawdzanie: gdy strona wróci, przeładuj */
var left=30,chk=document.getElementById('chk');
setInterval(function(){left--;chk.textContent='Sprawdzam ponownie za '+left+' s';if(left<=0){left=30;fetch(location.pathname+'?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.text()}).then(function(t){if(t.indexOf('data-przerwa')<0)location.reload()}).catch(function(){})}},1000);
</script></body></html>
