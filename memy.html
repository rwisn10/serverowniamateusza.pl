<!DOCTYPE html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ulubione memy — Mateusz Talar</title><meta name="description" content="Ulubione memy sztabu Mateusza Talara."><link rel="icon" href="logo.png"><link rel="stylesheet" href="style.css"></head><body><div id="nav"></div><main>
<header class="page-head"><div class="wrap"><span class="pill">Dla rozrywki</span><h1>Ulubione memy</h1><p>Kolekcja, która poprawia humor całemu sztabowi. Kliknij, żeby odtworzyć, i zaznacz serduszkiem swoje ulubione.</p></div></header>
<section style="padding-top:20px"><div class="wrap"><div class="memes" id="memes"></div></div></section>
</main><div id="foot"></div><script src="script.js"></script><script>
/* MEMY: dodaj plik do folderu memy/ i dopisz wiersz [nazwa_pliku_bez_rozszerzenia, tytuł, opis, czas] */
const MEMES=[["meme1", "Beef: podwale i Vetter", "Szkolne rywalizacje w najlepszym wydaniu.", "0:15", 576, 672], ["meme2", "Wywiad jak z National Geographic", "Powaga sytuacji: maksymalna.", "2:18", 492, 360], ["meme3", "Czerwone strzałki na polu", "Gdy wiesz, gdzie patrzeć.", "0:11", 576, 1024], ["meme4", "Pilne wiadomości", "Licznik tyka, studio na żywo.", "2:18", 576, 1024], ["meme5", "Smacznego!", "Kebab, który poprawia dzień.", "0:12", 576, 1024], ["meme6", "Ty na egzaminie państwowym w Word", "Każdy zna to uczucie.", "0:24", 576, 508], ["meme7", "Zwykły dzień, zwykły płyn", "Kontemplacja codzienności.", "0:17", 530, 1024], ["meme8", "FBI na ławce", "Siedzi, patrzy i wszystko widzi.", "0:13", 362, 272], ["meme9", "Faza idzie", "Gdy komputer pokazuje niebieski ekran.", "1:27", 480, 360], ["meme10", "Donbass plastinka", "Nagranie z internetu, tytuł z nazwy pliku.", "0:37", 360, 410], ["meme11", "Rakieta w akcji", "Zabawka, która potrafi zaskoczyć.", "0:19", 360, 592]];
let liked={};try{liked=JSON.parse(localStorage.getItem('memlikes')||'{}')}catch(e){}
const box=document.getElementById('memes');
box.innerHTML=MEMES.map(([f,t,d,l,w,hh])=>`<article class="card meme"><div class="vid" data-f="${f}" style="aspect-ratio:${w}/${hh}"><video preload="none" playsinline loop poster="${f}.jpg" src="${f}.mp4"></video><button class="play" aria-label="Odtwórz">▶</button></div><h3>${t}</h3><p>${d}</p><button class="like${liked[f]?' on':''}" data-f="${f}"><span class="h">${liked[f]?'♥':'♡'}</span> Ulubione</button></article>`).join('');
box.querySelectorAll('.vid').forEach(v=>{const vd=v.querySelector('video');
 vd.addEventListener('play',()=>v.classList.add('playing'));vd.addEventListener('pause',()=>v.classList.remove('playing'));
 v.addEventListener('click',e=>{if(e.target===vd&&vd.controls)return;
  if(vd.paused){document.querySelectorAll('.vid video').forEach(o=>{if(o!==vd)o.pause()});vd.controls=true;vd.play()}else vd.pause()})});
box.querySelectorAll('.like').forEach(b=>b.onclick=()=>{const f=b.dataset.f;liked[f]=!liked[f];b.classList.toggle('on',liked[f]);b.querySelector('.h').textContent=liked[f]?'♥':'♡';if(liked[f]){b.classList.add('pop');setTimeout(()=>b.classList.remove('pop'),500)}try{localStorage.setItem('memlikes',JSON.stringify(liked))}catch(e){}});
</script></body></html>
