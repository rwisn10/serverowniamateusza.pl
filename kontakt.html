<!DOCTYPE html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kontakt — Mateusz Talar</title><meta name="description" content="Napisz do sztabu."><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,800;1,9..144,600&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet"><link rel="icon" href="logo.png"><link rel="stylesheet" href="style.css"></head><body><div id="nav"></div><header class="page-head"><div class="wrap"><span class="pill">Kontakt</span><h1>Kontakt</h1><p>Napisz do nas lub zgłoś się do pracy w sztabie.</p></div></header><section><div class="wrap"><div class="grid g2"><div class="card reveal"><h3>Napisz do sztabu</h3><form id="contactForm" action="https://formspree.io/f/mkjowydg" method="POST"><input type="hidden" name="typ" value="wiadomość"><div><label>Imię i nazwisko</label><input name="name" required></div><div><label>E-mail</label><input type="email" name="email" required></div><div><label>Wiadomość</label><textarea name="message" rows="5" required></textarea></div><button class="btn red">Wyślij</button><p class="form-status" id="contactStatus" role="status" style="margin:10px 0 0;font-weight:600"></p></form></div><div class="card reveal d1"><h3>Dołącz do sztabu</h3><form id="signupForm" action="https://formspree.io/f/mkjowydg" method="POST"><input type="hidden" name="typ" value="zgłoszenie"><div><label>Imię i nazwisko</label><input name="name" required></div><div><label>E-mail</label><input type="email" name="email" required></div><div><label>Rola</label><select name="role"><option>Wolontariusz</option><option>Koordynator gminy</option><option>Darczyńca</option><option>Inne</option></select></div><button class="btn dark">Zgłaszam się</button><p class="form-status" id="signupStatus" role="status" style="margin:10px 0 0;font-weight:600"></p></form></div></div></div></section><div id="foot"></div><script src="script.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="supabase-config.js"></script><script>
(function(){
  var sb = (window.supabase && window.SB_URL) ? window.supabase.createClient(window.SB_URL, window.SB_KEY) : null;

  function wire(formId, statusId, table, pick, okMsg){
    var form = document.getElementById(formId), status = document.getElementById(statusId);
    var btn = form.querySelector('button');
    form.addEventListener('submit', async function(ev){
      ev.preventDefault();
      btn.disabled = true; status.textContent = 'Wysyłanie…';
      var row = pick(form), saved = false;
      // 1) zapis do bazy Supabase
      if(sb){
        try{
          var r = await sb.from(table).insert([row]);
          if(!r.error) saved = true;
        }catch(e){}
      }
      // 2) zapas: gdyby baza nie odpowiedziała, wysyłamy przez Formspree
      if(!saved){
        try{
          var res = await fetch(form.action, { method:'POST', body:new FormData(form), headers:{Accept:'application/json'} });
          saved = res.ok;
        }catch(e){}
      }
      status.textContent = saved ? okMsg : 'Nie udało się wysłać. Spróbuj ponownie za chwilę.';
      if(saved) form.reset();
      btn.disabled = false;
    });
  }

  wire('contactForm','contactStatus','contacts', function(f){
    return { name:f.name.value.trim(), email:f.email.value.trim(), message:f.message.value.trim() };
  }, 'Dziękujemy! Wiadomość została wysłana.');

  wire('signupForm','signupStatus','signups', function(f){
    return { name:f.name.value.trim(), email:f.email.value.trim(), role:f.role.value };
  }, 'Dziękujemy! Zgłoszenie zostało przyjęte.');
})();
</script></body></html>
